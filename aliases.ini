# llmlite-proxy model aliases (flat key=value, '#' comments; INI-friendly)
# format: alias = provider/model  (same target syntax as a prefixed model string)
# provider must be a built-in ProviderType (openai, deepseek, moonshot, minimax, ...)
# whose base URL is set via the LLMLITE_*_BASE_URL env vars.

glm53f = openai/glm-5.3-flash
glm53.tf3 = deepseek/GLM-5.3-EXL3
